<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>职官演变审查 · 宋代官制辞典</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='5' fill='none' stroke='%238c4a2f' stroke-width='3'/><text x='16' y='24' text-anchor='middle' font-size='22' font-weight='700' font-family='Songti SC,STSong,SimSun,serif' fill='%238c4a2f'>宋</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="4"
                fill="none" stroke="currentColor" stroke-width="2.2"/>
          <text x="16" y="23" text-anchor="middle"
                font-size="19" font-weight="700"
                font-family="'Songti SC','STSong','SimSun','Noto Serif CJK SC',serif"
                fill="currentColor">宋</text>
        </svg>
        <h1>职官演变审查</h1>
      </div>
      <span id="dbPath" class="db-path"></span>
    </div>
    <div id="metaCounts" class="meta-counts"></div>
    <div id="issueChips" class="issue-chips"></div>
  </header>

  <main class="columns">
    <aside class="col col-entries">
      <div class="col-head">
        <input id="entrySearch" type="search" placeholder="搜索辞典词条 / 已提取实体 / 页码">
        <label class="only-issues">
          <input id="onlyIssues" type="checkbox"> 只看有问题
        </label>
      </div>
      <div id="entryList" class="entry-list"></div>
    </aside>

    <section class="col col-text">
      <div class="col-head">
        <h2 id="entryTitle">辞典原文</h2>
      </div>
      <article id="entryText" class="entry-text">
        <p class="placeholder-tip">← 在左侧选择一个辞典条目开始审查</p>
      </article>
    </section>

    <section class="col col-data">
      <div class="col-head">
        <h2>结构化数据</h2>
        <span id="entityCount"></span>
        <button id="toggleRecords" class="record-toggle" type="button">显示 record</button>
      </div>
      <div id="entryIssues"></div>
      <div id="entityCards" class="entity-cards"></div>
    </section>
  </main>

  <div id="entityModal" class="modal hidden">
    <div class="modal-box">
      <header class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="modal-close">关闭 ✕</button>
      </header>
      <div class="modal-body">
        <div id="modalTimeline" class="modal-timeline"></div>
        <div id="modalEntries" class="modal-entries"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
